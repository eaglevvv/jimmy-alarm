<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Jimmy's Alarm</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="fixed-panel">
      <header class="hero">
        <div>
          <h1>Jimmy's Alarm</h1>
        </div>
        <div class="now" aria-live="polite">
          <time id="clock">--:--:--</time>
        </div>
      </header>


      <section class="controls" aria-label="新增鬧鐘">
          <button class="primary" id="add-alarm" type="button">＋ 新增鬧鐘</button>
          <div class="alarm-status">
          <span id="date">載入中</span>
          <span class="count" id="alarm-count">0 個已啟用</span>
        </div>
      </section>


      <section class="sound-settings" aria-label="鈴聲設定">
        <div>
          <p class="setting-title">鈴聲庫</p>
          <p class="setting-description" id="sound-name">可儲存最多 5 組自訂鈴聲</p>
        </div>
        <div class="sound-actions">
          <label class="quiet file-button" for="sound-file">匯入音訊</label>
